; ============================================================
; odoo.conf — Projet taaral / Odoo 19 Community
; ============================================================

[options]

; ── Sécurité ──────────────────────────────────────────────
; Générez : openssl rand -base64 32
admin_passwd = king@king

; ── Base de données ────────────────────────────────────────
db_host = ${DB_HOST}
db_port = 5432
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = False
db_maxconn = 32

; ── Serveur ────────────────────────────────────────────────
xmlrpc_interface =
xmlrpc_port = 8401
longpolling_port = 8402
proxy_mode = True

; ── Addons ─────────────────────────────────────────────────
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ── Données & logs ─────────────────────────────────────────
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo-taaral.log
log_level = warn
logrotate = True

; ── Workers ────────────────────────────────────────────────
workers = 2
max_cron_threads = 1

; ── Limites mémoire ────────────────────────────────────────
limit_memory_hard = 1677721600
limit_memory_soft = 629145600
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
