; ============================================================
; odoo.conf — Projet taaral / Odoo 19 Community
; Valeurs en dur — Pas de substitution d'env vars
; ============================================================

[options]

; ── Sécurité ──────────────────────────────────────────────

admin_passwd = 'kingking'

; ── Base de données ────────────────────────────────────────
; Valeurs en dur (pas de substitution)
db_host = 'taaral-dbb-63zjtg'
db_port = 5432
db_user = 'alicouran'
db_password = 'kingking'

db_name = False
db_maxconn = 32


; ── Serveur ────────────────────────────────────────────────
; Écouter sur tous les interfaces (Traefik fait le reverse proxy)
xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8601
longpolling_port = 8602
proxy_mode = True

; ── Addons ─────────────────────────────────────────────────
; Les deux chemins couvrent les différentes structures d'image Odoo 18/19
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ── Données & logs ─────────────────────────────────────────
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo-taaral.log
log_level = info
logrotate = True

; ── Workers ────────────────────────────────────────────────
; ⚠️ WORKERS = 0 pour le premier déploiement (mode thread unique)
; Plus simple, plus stable pour diagnostiquer.
; Réactivez workers = 2 une fois que tout fonctionne.
workers = 0
; max_cron_threads = 1

; ── Limites mémoire ────────────────────────────────────────
limit_memory_hard = 1677721600
limit_memory_soft = 629145600
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200