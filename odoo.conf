; ============================================================
; odoo.conf — Projet taaral / Odoo 19 Community
; ⚠️ Les ${...} sont remplacés par entrypoint.sh au démarrage
; ============================================================

[options]

; ── Sécurité ──────────────────────────────────────────────
; ⚠️ Changez ce mot de passe immédiatement !
admin_passwd = CHANGE_ME_MASTER_PWD_TAARAL

; ── Base de données ────────────────────────────────────────
; Ces valeurs sont injectées par entrypoint.sh via sed
db_host = ${DB_HOST}
db_port = 5432
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = False
db_maxconn = 32

; ── Serveur ────────────────────────────────────────────────
xmlrpc_interface =
xmlrpc_port = 8601
longpolling_port = 8602
proxy_mode = True

; ── Addons ─────────────────────────────────────────────────
; Les deux chemins couvrent les différentes structures d'image Odoo 18/19
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; ── Données & logs ─────────────────────────────────────────
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo-taaral.log
log_level = info
logrotate = True

; ── Workers ────────────────────────────────────────────────
; ⚠️ WORKERS = 0 pour le premier déploiement (mode thread unique)
; Plus simple, plus stable pour diagnostiquer.
; Réactivez workers = 2 une fois que tout fonctionne.
workers = 0
; max_cron_threads = 1

; ── Limites mémoire ────────────────────────────────────────
limit_memory_hard = 1677721600
limit_memory_soft = 629145600
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
